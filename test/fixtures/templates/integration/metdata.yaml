AWSTemplateFormatVersion: 2010-09-09

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Vpc Parameters'
        Parameters:
          - Vpc
  cfn-lint:
    config:
      bad_checks:
        - E3002

Parameters:
  # Vpc Parameters
  VpcId:
    Description: VPC To Create Stack In
    Type: String

Resources:
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:placeholder"
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
