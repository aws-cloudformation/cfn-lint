---
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  NodeGroups:
    Type: Number
    Default: 1
  ParameterGroup:
    Type: String
    Default: default.valkey8
Conditions:
  UseCluster: !Equals [!Ref NodeGroups, 3]
Resources:
  ClusteredGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: cluster mode enabled
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      ClusterMode: enabled
      TransitEncryptionEnabled: true
  MultiShardGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: three node groups
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      NumNodeGroups: 3
      ReplicasPerNodeGroup: 1
      TransitEncryptionEnabled: true
  ClusterParameterGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: cluster enabled parameter group
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      CacheParameterGroupName: default.valkey8.cluster.on
      TransitEncryptionEnabled: true
  UndeterminedNodeGroups:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: node groups from a parameter
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      NumNodeGroups: !Ref NodeGroups
      TransitEncryptionEnabled: true
  UndeterminedParameterGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: parameter group from a parameter
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      CacheParameterGroupName: !Ref ParameterGroup
      TransitEncryptionEnabled: true
  ConditionalGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: clustered in one scenario only
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      NumNodeGroups: !If [UseCluster, 3, 1]
      TransitEncryptionEnabled: true
  CustomParameterGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: single shard, pre-existing parameter group
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      NumNodeGroups: 1
      CacheParameterGroupName: my-custom-group
      TransitEncryptionEnabled: true
  SnapshotGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: restored from a snapshot by name
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      SnapshotName: my-snapshot
      TransitEncryptionEnabled: true
  SnapshotArnsGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: restored from snapshot arns
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      SnapshotArns:
        - arn:aws:elasticache:us-east-1:123456789012:snapshot:my-snapshot
      TransitEncryptionEnabled: true
  GlobalSecondaryGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: global datastore secondary
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      GlobalReplicationGroupId: my-global-group
      TransitEncryptionEnabled: true
  RefClusterParams:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: redis7
      Description: cluster mode on
      Properties:
        cluster-enabled: "yes"
  RefNodeGroupConfiguration:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: two shards by NodeGroupConfiguration
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: cache.t4g.micro
      CacheParameterGroupName: !Ref RefClusterParams
      AutomaticFailoverEnabled: true
      NodeGroupConfiguration:
        - NodeGroupId: "0001"
          ReplicaCount: 1
          Slots: "0-8191"
        - NodeGroupId: "0002"
          ReplicaCount: 1
          Slots: "8192-16383"
  RefReplicasPerNodeGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: one shard sized by ReplicasPerNodeGroup
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: cache.t4g.micro
      CacheParameterGroupName: !Ref RefClusterParams
      AutomaticFailoverEnabled: true
      ReplicasPerNodeGroup: 1
  TwoShardNodeGroupConfiguration:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: two shards by NodeGroupConfiguration, no parameter group
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: cache.t4g.micro
      AutomaticFailoverEnabled: true
      NodeGroupConfiguration:
        - NodeGroupId: "0001"
          ReplicaCount: 1
          Slots: "0-8191"
        - NodeGroupId: "0002"
          ReplicaCount: 1
          Slots: "8192-16383"
  DisabledGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: one shard, cluster mode disabled
      Engine: valkey
      CacheNodeType: cache.t4g.micro
      NumNodeGroups: 1
      ReplicasPerNodeGroup: 0
      TransitEncryptionEnabled: true
  ClusteredEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt ClusteredGroup.ConfigurationEndPoint.Address
  MultiShardEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt MultiShardGroup.ConfigurationEndPoint.Address
  ClusterParameterGroupEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt ClusterParameterGroup.ConfigurationEndPoint.Port
  UndeterminedNodeGroupsEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt UndeterminedNodeGroups.ConfigurationEndPoint.Address
  UndeterminedParameterGroupEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt UndeterminedParameterGroup.ConfigurationEndPoint.Address
  ConditionalEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt ConditionalGroup.ConfigurationEndPoint.Address
  CustomParameterGroupEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt CustomParameterGroup.ConfigurationEndPoint.Address
  SnapshotEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt SnapshotGroup.ConfigurationEndPoint.Address
  SnapshotArnsEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt SnapshotArnsGroup.ConfigurationEndPoint.Address
  GlobalSecondaryEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt GlobalSecondaryGroup.ConfigurationEndPoint.Address
  RefNodeGroupConfigurationEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt RefNodeGroupConfiguration.ConfigurationEndPoint.Address
  RefReplicasPerNodeGroupEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt RefReplicasPerNodeGroup.ConfigurationEndPoint.Address
  TwoShardNodeGroupConfigurationEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt TwoShardNodeGroupConfiguration.ConfigurationEndPoint.Address
  PrimaryEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Value: !GetAtt DisabledGroup.PrimaryEndPoint.Address
