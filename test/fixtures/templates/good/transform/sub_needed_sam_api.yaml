AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: "SAM Api with AWS variables API Gateway resolves in the OpenAPI body (E1029 positive)"
Resources:
  SamApiWithAwsVariables:
    Type: AWS::Serverless::Api
    Properties:
      Name: e1029-import-variables-sam
      StageName: test
      DefinitionBody:
        swagger: "2.0"
        info:
          title: e1029-import-variables-sam
        x-amazon-apigateway-policy:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: execute-api:Invoke
              Resource: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/GET/topics
        paths:
          /topics:
            get:
              responses:
                "200":
                  description: ok
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: arn:${AWS::Partition}:apigateway:${AWS::Region}:sns:action/ListTopics
